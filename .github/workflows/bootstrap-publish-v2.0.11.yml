name: Bootstrap publish v2.0.11

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-publish-v2.0.11.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch tagged publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref v2.0.11
