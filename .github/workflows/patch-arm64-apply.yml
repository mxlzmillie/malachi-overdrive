name: Apply deterministic ARM64 test patch

on:
  push:
    branches: [fix/windows-arm64-deterministic-waits]
    paths:
      - .github/workflows/patch-arm64-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/windows-arm64-deterministic-waits
          fetch-depth: 0
      - name: Apply and inspect deterministic test fix
        run: |
          set -euo pipefail
          python3 scripts/patch-arm64-deterministic-tests.py
          git diff --check
          git diff -- test/goal-backends.test.ts test/plugins-manager.test.ts
      - name: Commit test fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/goal-backends.test.ts test/plugins-manager.test.ts
          git commit -m 'Make ARM64 lifecycle tests deterministic'
          git push origin HEAD:fix/windows-arm64-deterministic-waits
