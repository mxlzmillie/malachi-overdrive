name: Patch deterministic ARM64 waits v2

on:
  push:
    branches: [fix/windows-arm64-deterministic-waits]
    paths:
      - .github/workflows/patch-arm64-deterministic-waits-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/windows-arm64-deterministic-waits
          fetch-depth: 0
      - name: Patch tests and CI by anchored sections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def section(text, start, end, replacement, label):
              if text.count(start) != 1:
                  raise SystemExit(f'{label}: expected one start marker, got {text.count(start)}')
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + replacement + text[b:]

          p = Path('test/goal-backends.test.ts')
          s = p.read_text()
          s = section(s, 'async function settled(id: string) {', "describe('Goal decision backends', () => {", """async function settled(id: string) {
  const view = () => goal.goalViewFor(id);
  const done = () => {
    const stage = view()?.stage;
    return stage !== undefined && stage !== 'sending' && stage !== 'answering';
  };
  if (!done()) await new Promise<void>((resolve) => {
    const unsubscribe = goal.onGoalChange(() => {
      if (!done()) return;
      unsubscribe();
      resolve();
    });
    if (done()) {
      unsubscribe();
      resolve();
    }
  });
  return view()!;
}
""", 'goal settled helper')
          p.write_text(s)

          p = Path('test/plugins-manager.test.ts')
          s = p.read_text()
          s = section(s,
              "  it('does not let a slow startup block a ready peer call or shutdown its process', async () => {",
              "  it('starts with zero installations and does not wait for enabled-server credential discovery on reopen', async () => {",
              """  it('does not let a slow startup block a ready peer call or shutdown its process', async () => {
    const h = await trackedFixture();
    const slowEntry = path.join(dir, 'slow-server.cjs');
    await fs.writeFile(slowEntry, fixture.replaceAll('Echo.Mixed', 'Slow.Echo'));
    const slow = (await manager.install({ source: { kind: 'command', command: process.execPath, args: [slowEntry] }, credentials: { TEST_SECRET: 'slow' } })).plugins.find(row => row.id !== h.row.id)!;
    await manager.close();
    let release!: (value: string) => void;
    vi.mocked(getSecret).mockImplementationOnce(() => new Promise(resolve => { release = resolve; }));
    manager = new PluginManager();
    await manager.initialize(dir);
    const peerReady = () => manager.snapshot().plugins.find(row => row.id === h.row.id)?.status === 'ready';
    try {
      if (!peerReady()) await new Promise<void>((resolve) => {
        const unsubscribe = manager.onChanged(() => {
          if (!peerReady()) return;
          unsubscribe();
          resolve();
        });
        if (peerReady()) {
          unsubscribe();
          resolve();
        }
      });
      expect(manager.snapshot().plugins.find(row => row.id === slow.id)!.status).toBe('connecting');
      const result = await manager.call('Echo.Mixed', { value: 'ready peer' });
      expect(result.isError).not.toBe(true);
      expect(result.structuredContent).toEqual({ value: 'ready peer' });
      expect(manager.snapshot().plugins.find(row => row.id === slow.id)!.status).toBe('connecting');
      const active = (await h.pids()).at(-1)!;
      await manager.close();
      expect(alive(active.pid)).toBe(false);
    } finally { release?.('slow'); }
  });
""", 'plugin slow-start test')
          p.write_text(s)

          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          anchor = "          - name: Windows x64\n            runner: windows-2025\n"
          if s.count(anchor) != 1:
              raise SystemExit(f'CI x64 anchor: expected one, got {s.count(anchor)}')
          insertion = anchor + "          - name: Windows arm64\n            runner: windows-11-arm\n"
          p.write_text(s.replace(anchor, insertion, 1))
          PY
          git diff --check
          git diff -- test/goal-backends.test.ts test/plugins-manager.test.ts .github/workflows/ci.yml
      - name: Commit fix and remove patch bootstraps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/goal-backends.test.ts test/plugins-manager.test.ts .github/workflows/ci.yml
          git commit -m 'Make ARM64 lifecycle tests deterministic'
          git rm -f .github/workflows/patch-arm64-deterministic-waits.yml .github/workflows/patch-arm64-deterministic-waits-v2.yml
          git commit -m 'Remove one-time ARM64 patch workflows'
          git push origin HEAD:fix/windows-arm64-deterministic-waits
