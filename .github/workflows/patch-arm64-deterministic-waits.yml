name: Patch deterministic ARM64 waits

on:
  push:
    branches: [fix/windows-arm64-deterministic-waits]
    paths:
      - .github/workflows/patch-arm64-deterministic-waits.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/windows-arm64-deterministic-waits
          fetch-depth: 0

      - name: Replace wall-clock polling with lifecycle synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          goal_path = Path('test/goal-backends.test.ts')
          goal = goal_path.read_text()
          old_goal = """async function settled(id: string) {
            await vi.waitFor(() => expect(goal.goalViewFor(id)?.stage).not.toMatch(/^(sending|answering)$/));
            return goal.goalViewFor(id)!;
          }
          """
          new_goal = """async function settled(id: string) {
            const view = () => goal.goalViewFor(id);
            const done = () => {
              const stage = view()?.stage;
              return stage !== undefined && stage !== 'sending' && stage !== 'answering';
            };
            if (!done()) await new Promise<void>((resolve) => {
              const unsubscribe = goal.onGoalChange(() => {
                if (!done()) return;
                unsubscribe();
                resolve();
              });
              if (done()) {
                unsubscribe();
                resolve();
              }
            });
            return view()!;
          }
          """
          if goal.count(old_goal) != 1:
            raise SystemExit('goal settled helper did not match exactly once')
          goal_path.write_text(goal.replace(old_goal, new_goal))

          plugin_path = Path('test/plugins-manager.test.ts')
          plugin = plugin_path.read_text()
          old_plugin = """  it('does not let a slow startup block a ready peer call or shutdown its process', async () => {
            const h = await trackedFixture();
            const slowEntry = path.join(dir, 'slow-server.cjs');
            await fs.writeFile(slowEntry, fixture.replaceAll('Echo.Mixed', 'Slow.Echo'));
            await manager.install({ source: { kind: 'command', command: process.execPath, args: [slowEntry] }, credentials: { TEST_SECRET: 'slow' } });
            await manager.close();
            let release!: (value: string) => void;
            vi.mocked(getSecret).mockImplementationOnce(() => new Promise(resolve => { release = resolve; }));
            manager = new PluginManager(); await manager.initialize(dir);
            try {
              await vi.waitFor(() => expect(manager.snapshot().plugins.find(row => row.id === h.row.id)!.status).toBe('ready'));
              const result = await Promise.race([manager.call('Echo.Mixed', { value: 'ready peer' }), new Promise(resolve => setTimeout(() => resolve('blocked'), 200))]);
              expect(result).not.toBe('blocked');
              const active = (await h.pids()).at(-1)!;
              const closing = manager.close();
              await vi.waitFor(() => expect(alive(active.pid)).toBe(false), { timeout: 1000 });
              await closing;
            } finally { release?.('slow'); }
          });
          """
          new_plugin = """  it('does not let a slow startup block a ready peer call or shutdown its process', async () => {
            const h = await trackedFixture();
            const slowEntry = path.join(dir, 'slow-server.cjs');
            await fs.writeFile(slowEntry, fixture.replaceAll('Echo.Mixed', 'Slow.Echo'));
            const slow = (await manager.install({ source: { kind: 'command', command: process.execPath, args: [slowEntry] }, credentials: { TEST_SECRET: 'slow' } })).plugins.find(row => row.id !== h.row.id)!;
            await manager.close();
            let release!: (value: string) => void;
            vi.mocked(getSecret).mockImplementationOnce(() => new Promise(resolve => { release = resolve; }));
            manager = new PluginManager(); await manager.initialize(dir);
            const peerReady = () => manager.snapshot().plugins.find(row => row.id === h.row.id)?.status === 'ready';
            try {
              if (!peerReady()) await new Promise<void>((resolve) => {
                const unsubscribe = manager.onChanged(() => {
                  if (!peerReady()) return;
                  unsubscribe();
                  resolve();
                });
                if (peerReady()) {
                  unsubscribe();
                  resolve();
                }
              });
              expect(manager.snapshot().plugins.find(row => row.id === slow.id)!.status).toBe('connecting');
              const result = await manager.call('Echo.Mixed', { value: 'ready peer' });
              expect(result.isError).not.toBe(true);
              expect(result.structuredContent).toEqual({ value: 'ready peer' });
              expect(manager.snapshot().plugins.find(row => row.id === slow.id)!.status).toBe('connecting');
              const active = (await h.pids()).at(-1)!;
              await manager.close();
              expect(alive(active.pid)).toBe(false);
            } finally { release?.('slow'); }
          });
          """
          if plugin.count(old_plugin) != 1:
            raise SystemExit('plugin slow-start test did not match exactly once')
          plugin_path.write_text(plugin.replace(old_plugin, new_plugin))

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          old_ci = """          - name: Windows x64
                    runner: windows-2025
                  - name: macOS arm64
          """
          new_ci = """          - name: Windows x64
                    runner: windows-2025
                  - name: Windows arm64
                    runner: windows-11-arm
                  - name: macOS arm64
          """
          if ci.count(old_ci) != 1:
            raise SystemExit('CI Windows matrix did not match exactly once')
          ci_path.write_text(ci.replace(old_ci, new_ci))
          PY

          git diff --check
          git diff -- test/goal-backends.test.ts test/plugins-manager.test.ts .github/workflows/ci.yml

      - name: Commit isolated fix and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/goal-backends.test.ts test/plugins-manager.test.ts .github/workflows/ci.yml
          git commit -m 'Make ARM64 lifecycle tests deterministic'
          git rm .github/workflows/patch-arm64-deterministic-waits.yml
          git commit -m 'Remove one-time ARM64 patch workflow'
          git push origin HEAD:fix/windows-arm64-deterministic-waits
