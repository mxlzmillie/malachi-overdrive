name: Publish release

# Dispatch this at the tag you want released:
#   gh workflow run publish.yml --ref v2.0.2
#
# It builds the candidate itself rather than adopting one from an earlier run, so the
# installers attached to a release are provably the ones produced from that tag by the
# pipeline in that tag's own tree.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      # Fail cheap before allocating the six native packaging runners. The final publish step
      # repeats the release-exists check to close the race while the candidate is building.
      - name: Refuse to publish from anything but a tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "publish.yml must be dispatched at a tag; got $GITHUB_REF_TYPE $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi

      - name: Verify release metadata agrees
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const manifest = require('./extension/manifest.json');
          const versionSource = fs.readFileSync('src/main/version.ts', 'utf8');
          const appVersion = versionSource.match(/APP_VERSION = '([^']+)'/)?.[1];
          const versions = [pkg.version, lock.version, lock.packages?.['']?.version, manifest.version, appVersion];
          if (versions.some((version) => version !== pkg.version)) {
            throw new Error(`Release versions disagree: ${versions.join(', ')}`);
          }

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const changelogVersion = changelog.match(/^## \[(\d+\.\d+\.\d+)\]/m)?.[1];
          if (changelogVersion !== pkg.version) {
            throw new Error(`Top changelog entry ${changelogVersion ?? '<missing>'} does not match ${pkg.version}`);
          }

          const notesPath = `docs/release-notes/v${pkg.version}.md`;
          if (!fs.existsSync(notesPath)) throw new Error(`Missing ${notesPath}`);
          const notes = fs.readFileSync(notesPath, 'utf8');
          if (!notes.includes(`## ${pkg.version}`)) throw new Error(`${notesPath} has no matching version heading`);
          if (!/Developer ID/i.test(notes) || !/notariz/i.test(notes)) {
            throw new Error(`${notesPath} must document Developer ID signing and macOS notarization`);
          }
          for (const artifact of [
            'MALACHI-OVERDRIVE-Setup-x64.exe',
            'MALACHI-OVERDRIVE-Setup-arm64.exe',
            'MALACHI-OVERDRIVE-macOS-x64.dmg',
            'MALACHI-OVERDRIVE-macOS-x64.zip',
            'MALACHI-OVERDRIVE-macOS-arm64.dmg',
            'MALACHI-OVERDRIVE-macOS-arm64.zip',
            'MALACHI-OVERDRIVE-Linux-x64.AppImage',
            'MALACHI-OVERDRIVE-Linux-x64.deb',
            'MALACHI-OVERDRIVE-Linux-arm64.AppImage',
            'MALACHI-OVERDRIVE-Linux-arm64.deb',
            'MALACHI-OVERDRIVE-Extension.zip',
            'MALACHI-OVERDRIVE-Native-Sources.tar.gz',
            'SHA256SUMS.txt'
          ]) {
            if (!notes.includes(`\`${artifact}\``)) throw new Error(`${notesPath} is missing ${artifact}`);
          }
          NODE

      # A release remains reproducible because the tunnel bytes are version/checksum pinned.
      # Refuse a stale pin instead of silently changing the payload named by this tag.
      - name: Require current OpenAI tunnel-client
        run: npm run verify:tunnel-current

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      - name: Require reviewed release notes for this tag
        run: |
          set -euo pipefail
          notes="docs/release-notes/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "Missing $notes — write the release notes and tag again." >&2
            exit 1
          fi

      - name: Refuse an existing release
        run: node scripts/check-release-absent.mjs

  candidate:
    name: Build candidate
    needs: preflight
    uses: ./.github/workflows/release.yml
    with:
      require_macos_signing: true
    secrets: inherit

  publish:
    name: Publish
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      # A branch has no version guarantee — release.yml only checks the tag against
      # package.json when the ref is a tag — so a branch must never reach `gh release create`.
      - name: Refuse to publish from anything but a tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "publish.yml must be dispatched at a tag; got $GITHUB_REF_TYPE $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      # Release notes are written by hand and reviewed in the tagged tree. Generating
      # them here would mean the release said something nobody read before it shipped.
      - name: Require reviewed release notes for this tag
        run: |
          set -euo pipefail
          notes="docs/release-notes/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "Missing $notes — write the release notes and tag again." >&2
            exit 1
          fi

      - name: Download the candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chat-on-steroids-candidate-${{ github.run_id }}
          path: publish

      # The checksums were computed on the packaging runner. Re-checking them here proves
      # the bytes about to be attached are the bytes that were smoke-tested.
      - name: Re-verify the checksums
        working-directory: publish
        run: |
          set -euo pipefail
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish the release
        run: |
          set -euo pipefail
          # Repeat after the native candidate build so a new upstream release published while
          # the six runners were working cannot leave this release stale.
          npm run verify:tunnel-current
          node scripts/check-release-absent.mjs
          gh release create "$TAG" \
            publish/MALACHI-OVERDRIVE-Setup-x64.exe \
            publish/MALACHI-OVERDRIVE-Setup-arm64.exe \
            publish/MALACHI-OVERDRIVE-macOS-x64.dmg \
            publish/MALACHI-OVERDRIVE-macOS-x64.zip \
            publish/MALACHI-OVERDRIVE-macOS-arm64.dmg \
            publish/MALACHI-OVERDRIVE-macOS-arm64.zip \
            publish/MALACHI-OVERDRIVE-Linux-x64.AppImage \
            publish/MALACHI-OVERDRIVE-Linux-x64.deb \
            publish/MALACHI-OVERDRIVE-Linux-arm64.AppImage \
            publish/MALACHI-OVERDRIVE-Linux-arm64.deb \
            publish/MALACHI-OVERDRIVE-Extension.zip \
            publish/MALACHI-OVERDRIVE-Native-Sources.tar.gz \
            publish/SHA256SUMS.txt \
            --title "$(sed -n 's/^## //p' "docs/release-notes/$TAG.md" | head -n 1)" \
            --notes-file "docs/release-notes/$TAG.md"

      # GitHub is the final distribution boundary. Re-download the public assets into a fresh
      # directory and prove both the exact asset set and every payload digest still match the
      # candidate that passed the native packaging matrix.
      - name: Verify the published release
        run: |
          set -euo pipefail
          expected_assets="$(cat <<'EOF'
          MALACHI-OVERDRIVE-Extension.zip
          MALACHI-OVERDRIVE-Linux-arm64.AppImage
          MALACHI-OVERDRIVE-Linux-arm64.deb
          MALACHI-OVERDRIVE-Linux-x64.AppImage
          MALACHI-OVERDRIVE-Linux-x64.deb
          MALACHI-OVERDRIVE-Native-Sources.tar.gz
          MALACHI-OVERDRIVE-Setup-arm64.exe
          MALACHI-OVERDRIVE-Setup-x64.exe
          MALACHI-OVERDRIVE-macOS-arm64.dmg
          MALACHI-OVERDRIVE-macOS-arm64.zip
          MALACHI-OVERDRIVE-macOS-x64.dmg
          MALACHI-OVERDRIVE-macOS-x64.zip
          SHA256SUMS.txt
          EOF
          )"
          published_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [ "$published_assets" != "$expected_assets" ]; then
            echo "Published asset set does not match the reviewed release contract." >&2
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$published_assets") || true
            exit 1
          fi

          published_dir="$(mktemp -d)"
          trap 'rm -rf "$published_dir"' EXIT
          gh release download "$TAG" --dir "$published_dir"
          cmp publish/SHA256SUMS.txt "$published_dir/SHA256SUMS.txt"
          (
            cd "$published_dir"
            sha256sum -c SHA256SUMS.txt
          )
          gh release view "$TAG" --json url --jq .url
