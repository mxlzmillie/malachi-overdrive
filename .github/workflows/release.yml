name: Release candidate

on:
  workflow_call:
    inputs:
      require_macos_signing:
        description: Require Developer ID signing and Apple notarization for macOS artifacts
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      require_macos_signing:
        description: Require Developer ID signing and Apple notarization for macOS artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Baked into the packaged main process. A fork/private product build therefore follows only
  # releases from the repository that actually built it, never the original public upstream.
  MALACHI_OVERDRIVE_RELEASE_REPOSITORY: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sources:
    name: Package native library sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Verify and archive corresponding native sources
        run: node scripts/package-native-sources.mjs
      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-native-sources
          path: release/MALACHI-OVERDRIVE-Native-Sources.tar.gz
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: win32
            arch: x64
            runner: windows-2025
            script: dist:x64
            artifact: package-windows-x64
            files: release/MALACHI-OVERDRIVE-Setup-x64.exe
          - name: Windows arm64
            platform: win32
            arch: arm64
            runner: windows-11-arm
            script: dist:arm64
            artifact: package-windows-arm64
            files: release/MALACHI-OVERDRIVE-Setup-arm64.exe
          - name: macOS x64
            platform: darwin
            arch: x64
            runner: macos-15-intel
            script: dist:mac:x64
            artifact: package-macos-x64
            files: |
              release/MALACHI-OVERDRIVE-macOS-x64.dmg
              release/MALACHI-OVERDRIVE-macOS-x64.zip
          - name: macOS arm64
            platform: darwin
            arch: arm64
            runner: macos-15
            script: dist:mac:arm64
            artifact: package-macos-arm64
            files: |
              release/MALACHI-OVERDRIVE-macOS-arm64.dmg
              release/MALACHI-OVERDRIVE-macOS-arm64.zip
          - name: Linux x64
            platform: linux
            arch: x64
            runner: ubuntu-24.04
            script: dist:linux:x64
            artifact: package-linux-x64
            files: |
              release/MALACHI-OVERDRIVE-Linux-x64.AppImage
              release/MALACHI-OVERDRIVE-Linux-x64.deb
          - name: Linux arm64
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            script: dist:linux:arm64
            artifact: package-linux-arm64
            files: |
              release/MALACHI-OVERDRIVE-Linux-arm64.AppImage
              release/MALACHI-OVERDRIVE-Linux-arm64.deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      COS_REQUIRE_MACOS_SIGNING: ${{ matrix.platform == 'darwin' && inputs.require_macos_signing && '1' || '0' }}
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      MACOS_APPLE_API_KEY_CONTENT: ${{ secrets.MACOS_APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.MACOS_APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.MACOS_APPLE_API_ISSUER }}
      # Public identifier pinned by the bundle audit so a different Developer ID cannot pass.
      APPLE_TEAM_ID: K5Q2CQN9PQ

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize App Store Connect notarization key
        if: matrix.platform == 'darwin' && inputs.require_macos_signing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MACOS_APPLE_API_KEY_CONTENT"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$MACOS_APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: node -e "const v=require('./package.json').version;if(process.env.GITHUB_REF_NAME!=='v'+v)throw new Error('Tag '+process.env.GITHUB_REF_NAME+' does not match package version '+v)"

      - name: Verify
        run: npm run verify:ci

      - name: Prove native runner target
        run: node -e "if(process.platform!=='${{ matrix.platform }}'||process.arch!=='${{ matrix.arch }}')throw new Error('Expected ${{ matrix.platform }}-${{ matrix.arch }}, got '+process.platform+'-'+process.arch)"

      - name: Package
        run: npm run ${{ matrix.script }}

      - name: Smoke packaged runtime natively
        run: node scripts/smoke-packaged-runtime.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Install generated Windows NSIS package
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD 'release/MALACHI-OVERDRIVE-Setup-${{ matrix.arch }}.exe'
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Missing Windows installer: $installer"
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'malachi-overdrive-installed-${{ matrix.arch }}'
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "Windows installer exited with status $($install.ExitCode)"
          }
          $installedExe = Join-Path $installDir 'MALACHI OVERDRIVE.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) {
            throw "Windows installer did not create $installedExe"
          }
          node scripts/smoke-packaged-runtime.mjs --platform win32 --arch '${{ matrix.arch }}' --root "$installDir"
          "COS_WINDOWS_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Launch installed Windows app normally
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installedExe = Join-Path $env:COS_WINDOWS_INSTALL_DIR 'MALACHI OVERDRIVE.exe'
          if (-not (Test-Path -LiteralPath $installedExe)) {
            throw "Installed Windows executable is missing: $installedExe"
          }
          $profile = Join-Path $env:RUNNER_TEMP 'malachi-overdrive-gui-${{ matrix.arch }}'
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          $stdout = Join-Path $profile 'stdout.log'
          $stderr = Join-Path $profile 'stderr.log'
          $env:CLF_DEBUG = '1'
          $process = Start-Process -FilePath $installedExe -ArgumentList "--user-data-dir=$profile" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $startedAt = [DateTime]::UtcNow
          $deadline = $startedAt.AddSeconds(20)
          $ready = $false
          $failureMessage = $null
          while ([DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            if ($process.HasExited) {
              $failureMessage = "Installed Windows GUI exited before renderer readiness"
              break
            }
            $output = ''
            if (Test-Path -LiteralPath $stdout) { $output += Get-Content -LiteralPath $stdout -Raw }
            if (Test-Path -LiteralPath $stderr) { $output += Get-Content -LiteralPath $stderr -Raw }
            foreach ($failure in @('[error] window failed to load', '[error] renderer:')) {
              if ($output.Contains($failure)) {
                $failureMessage = "Installed Windows GUI reported $failure"
                break
              }
            }
            if ($failureMessage) { break }
            $markersReady = $true
            foreach ($marker in @('[info] app started', '[info] window loaded', '[info] renderer state ready')) {
              if (-not $output.Contains($marker)) { $markersReady = $false }
            }
            if ($markersReady -and (([DateTime]::UtcNow - $startedAt).TotalSeconds -ge 10)) {
              $ready = $true
              break
            }
          }
          if (-not $ready -and -not $failureMessage) {
            $failureMessage = "Installed Windows GUI did not become renderer-ready within 20 seconds"
          }
          $process.Refresh()
          if (-not $process.HasExited) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            Start-Sleep -Milliseconds 500
          }
          $output = ''
          if (Test-Path -LiteralPath $stdout) { $output += Get-Content -LiteralPath $stdout -Raw }
          if (Test-Path -LiteralPath $stderr) { $output += Get-Content -LiteralPath $stderr -Raw }
          Write-Host $output
          if ($failureMessage) { throw $failureMessage }

      - name: Audit packaged macOS bundle metadata and Mach-O payloads
        if: matrix.platform == 'darwin'
        run: node scripts/smoke-macos-bundle.mjs ${{ matrix.arch }}

      - name: Verify generated macOS archives
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$PWD/release/MALACHI-OVERDRIVE-macOS-${{ matrix.arch }}.dmg"
          zip="$PWD/release/MALACHI-OVERDRIVE-macOS-${{ matrix.arch }}.zip"
          test -f "$dmg"
          test -f "$zip"
          hdiutil verify "$dmg"
          unzip -tq "$zip"
          mount_dir="$(mktemp -d)"
          zip_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
            rm -rf "$zip_dir"
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg" >/dev/null
          test -d "$mount_dir/MALACHI OVERDRIVE.app"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = /Applications
          test -x "$mount_dir/MALACHI OVERDRIVE.app/Contents/MacOS/MALACHI OVERDRIVE"
          test -f "$mount_dir/MALACHI OVERDRIVE.app/Contents/Info.plist"
          node scripts/smoke-macos-bundle.mjs '${{ matrix.arch }}' "$mount_dir/MALACHI OVERDRIVE.app"
          # ditto is the macOS-native ZIP extractor and preserves executable modes/metadata.
          ditto -x -k "$zip" "$zip_dir"
          test -d "$zip_dir/MALACHI OVERDRIVE.app"
          test -x "$zip_dir/MALACHI OVERDRIVE.app/Contents/MacOS/MALACHI OVERDRIVE"
          test -f "$zip_dir/MALACHI OVERDRIVE.app/Contents/Info.plist"
          node scripts/smoke-macos-bundle.mjs '${{ matrix.arch }}' "$zip_dir/MALACHI OVERDRIVE.app"

      - name: Launch packaged macOS app normally
        if: matrix.platform == 'darwin'
        run: node scripts/smoke-macos-gui.mjs ${{ matrix.arch }}

      - name: Install generated DEB on target distro
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$PWD/release/MALACHI-OVERDRIVE-Linux-${{ matrix.arch }}.deb"
          test -f "$deb"
          echo "Generated control metadata:"
          dpkg-deb --field "$deb" Package Version Architecture Depends
          test "$(dpkg-deb --field "$deb" Package)" = chat-on-steroids
          test "$(dpkg-deb --field "$deb" Version)" = "$(node -p "require('./package.json').version")"
          expected_deb_arch=arm64
          if [ '${{ matrix.arch }}' = x64 ]; then expected_deb_arch=amd64; fi
          test "$(dpkg-deb --field "$deb" Architecture)" = "$expected_deb_arch"
          depends="$(dpkg-deb --field "$deb" Depends)"
          printf '%s\n' "$depends" | grep -Eq 'libgtk-3-0[[:space:]]*\|[[:space:]]*libgtk-3-0t64|libgtk-3-0t64[[:space:]]*\|[[:space:]]*libgtk-3-0'
          printf '%s\n' "$depends" | grep -Eq 'libatspi2\.0-0[[:space:]]*\|[[:space:]]*libatspi2\.0-0t64|libatspi2\.0-0t64[[:space:]]*\|[[:space:]]*libatspi2\.0-0'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$deb"
          sudo apt-get install -y --no-install-recommends xvfb xauth
          dpkg-query -W -f='${Status}\n' chat-on-steroids | grep -Fxq 'install ok installed'
          desktop=/usr/share/applications/com.chatonsteroids.app.desktop
          test -f "$desktop"
          grep -Fxq 'Name=MALACHI OVERDRIVE' "$desktop"
          grep -Fxq 'Icon=chat-on-steroids' "$desktop"
          grep -Fxq 'StartupWMClass=com.chatonsteroids.app' "$desktop"
          # electron-builder's DEB postinstall registers /usr/bin through update-alternatives.
          # Prove package integration is present, then anchor the full runtime smoke at the
          # package-owned resolved binary rather than assuming an /opt product-directory spelling.
          test -L /usr/bin/chat-on-steroids
          ELECTRON_RUN_AS_NODE=1 /usr/bin/chat-on-steroids -e "if(process.platform!=='linux'||process.arch!=='${{ matrix.arch }}')process.exit(9); console.log('deb-runtime-ok')" | grep -Fxq 'deb-runtime-ok'
          installed_executable="$(readlink -f /usr/bin/chat-on-steroids)"
          test -x "$installed_executable"
          dpkg-query -S "$installed_executable" | grep -Eq '^chat-on-steroids:'
          node scripts/smoke-packaged-runtime.mjs --platform linux --arch '${{ matrix.arch }}' --root "$(dirname "$installed_executable")"

      - name: Launch installed DEB normally under Xvfb
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          deb_smoke_root="$(mktemp -d)"
          trap 'rm -rf "$deb_smoke_root"' EXIT
          mkdir -p \
            "$deb_smoke_root/home" \
            "$deb_smoke_root/config" \
            "$deb_smoke_root/cache" \
            "$deb_smoke_root/data" \
            "$deb_smoke_root/state"
          set +e
          HOME="$deb_smoke_root/home" \
          XDG_CONFIG_HOME="$deb_smoke_root/config" \
          XDG_CACHE_HOME="$deb_smoke_root/cache" \
          XDG_DATA_HOME="$deb_smoke_root/data" \
          XDG_STATE_HOME="$deb_smoke_root/state" \
          CLF_DEBUG=1 timeout --signal=TERM --kill-after=5s 12s xvfb-run -a /usr/bin/chat-on-steroids >deb-gui.log 2>&1
          status=$?
          set -e
          cat deb-gui.log
          if [ "$status" -ne 124 ]; then
            echo "Installed DEB GUI exited before the intentional timeout (status $status)" >&2
            exit 1
          fi
          grep -Fq '[info] app started' deb-gui.log
          grep -Fq '[info] window loaded' deb-gui.log
          grep -Fq '[info] renderer state ready' deb-gui.log
          if grep -Fq '[error] window failed to load' deb-gui.log || grep -Fq '[error] renderer:' deb-gui.log; then
            echo "Installed DEB GUI reported a renderer startup failure" >&2
            exit 1
          fi

      - name: Execute generated static-runtime AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$PWD/release/MALACHI-OVERDRIVE-Linux-${{ matrix.arch }}.AppImage"
          test -x "$appimage"
          # Exercise the actual static-runtime artifact through Chromium/Electron startup and
          # require renderer-state proof rather than accepting a process that merely hangs.
          # Do not use Electron's Node mode through AppRun here: when user namespaces are blocked,
          # the 1.0.3 launcher can prepend --no-sandbox, which Node mode rejects as a bad option.
          # The unpacked native-runtime probe above already validates every native dependency.
          # First launch with the runner's real namespace/tool environment. Then force the
          # launcher's namespace probe to fail in a second, independently isolated profile so CI
          # covers both the ordinary host decision and the documented --no-sandbox fallback.
          fake_bin="$(mktemp -d)"
          normal_smoke_root="$(mktemp -d)"
          fallback_smoke_root="$(mktemp -d)"
          cleanup() {
            rm -rf "$fake_bin" "$normal_smoke_root" "$fallback_smoke_root"
          }
          trap cleanup EXIT
          printf '#!/bin/sh\nexit 1\n' > "$fake_bin/unshare"
          chmod +x "$fake_bin/unshare"
          run_appimage_smoke() {
            label="$1"
            smoke_root="$2"
            launch_path="$3"
            log="$4"
            mkdir -p \
              "$smoke_root/home" \
              "$smoke_root/config" \
              "$smoke_root/cache" \
              "$smoke_root/data" \
              "$smoke_root/state"
            set +e
            HOME="$smoke_root/home" \
            XDG_CONFIG_HOME="$smoke_root/config" \
            XDG_CACHE_HOME="$smoke_root/cache" \
            XDG_DATA_HOME="$smoke_root/data" \
            XDG_STATE_HOME="$smoke_root/state" \
            PATH="$launch_path" \
            CLF_DEBUG=1 timeout --signal=TERM --kill-after=5s 12s xvfb-run -a "$appimage" >"$log" 2>&1
            status=$?
            set -e
            cat "$log"
            if [ "$status" -ne 124 ]; then
              echo "AppImage $label GUI exited before the intentional timeout (status $status)" >&2
              exit 1
            fi
            grep -Fq '[info] app started' "$log"
            grep -Fq '[info] window loaded' "$log"
            grep -Fq '[info] renderer state ready' "$log"
            if grep -Fq '[error] window failed to load' "$log" || grep -Fq '[error] renderer:' "$log"; then
              echo "AppImage $label GUI reported a renderer startup failure" >&2
              exit 1
            fi
          }
          run_appimage_smoke normal "$normal_smoke_root" "$PATH" appimage-normal-gui.log
          run_appimage_smoke forced-fallback "$fallback_smoke_root" "$fake_bin:$PATH" appimage-fallback-gui.log

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble release candidate
    needs: [package, sources]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true

      - name: Package standalone extension
        run: |
          set -euo pipefail
          (cd extension && zip -qr ../release/MALACHI-OVERDRIVE-Extension.zip . -x '*.map')
          zip -q release/MALACHI-OVERDRIVE-Extension.zip LICENSE
          node -e "const m=require('./extension/manifest.json'),p=require('./package.json');if(m.version!==p.version)throw new Error('Extension '+m.version+' does not match app '+p.version)"
          for required in manifest.json background.js chatgpt-dom.js content.js fiber.js overlay.css popup.html popup.css popup.js icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png LICENSE; do
            unzip -Z1 release/MALACHI-OVERDRIVE-Extension.zip | grep -Fxq "$required" || { echo "Extension zip missing $required" >&2; exit 1; }
          done

      - name: Create SHA-256 checksums
        run: |
          set -euo pipefail
          files=(
            release/MALACHI-OVERDRIVE-Setup-x64.exe
            release/MALACHI-OVERDRIVE-Setup-arm64.exe
            release/MALACHI-OVERDRIVE-macOS-x64.dmg
            release/MALACHI-OVERDRIVE-macOS-x64.zip
            release/MALACHI-OVERDRIVE-macOS-arm64.dmg
            release/MALACHI-OVERDRIVE-macOS-arm64.zip
            release/MALACHI-OVERDRIVE-Linux-x64.AppImage
            release/MALACHI-OVERDRIVE-Linux-x64.deb
            release/MALACHI-OVERDRIVE-Linux-arm64.AppImage
            release/MALACHI-OVERDRIVE-Linux-arm64.deb
            release/MALACHI-OVERDRIVE-Extension.zip
            release/MALACHI-OVERDRIVE-Native-Sources.tar.gz
          )
          for file in "${files[@]}"; do test -f "$file" || { echo "Missing $file" >&2; exit 1; }; done
          (cd release && sha256sum \
            MALACHI-OVERDRIVE-Setup-x64.exe \
            MALACHI-OVERDRIVE-Setup-arm64.exe \
            MALACHI-OVERDRIVE-macOS-x64.dmg \
            MALACHI-OVERDRIVE-macOS-x64.zip \
            MALACHI-OVERDRIVE-macOS-arm64.dmg \
            MALACHI-OVERDRIVE-macOS-arm64.zip \
            MALACHI-OVERDRIVE-Linux-x64.AppImage \
            MALACHI-OVERDRIVE-Linux-x64.deb \
            MALACHI-OVERDRIVE-Linux-arm64.AppImage \
            MALACHI-OVERDRIVE-Linux-arm64.deb \
            MALACHI-OVERDRIVE-Extension.zip \
            MALACHI-OVERDRIVE-Native-Sources.tar.gz > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Artifact names reject `/`, so direct candidate runs from feature/foo refs must not
          # fail after all six package jobs. A run id is filesystem-safe and caller-stable.
          name: chat-on-steroids-candidate-${{ github.run_id }}
          path: |
            release/MALACHI-OVERDRIVE-Setup-x64.exe
            release/MALACHI-OVERDRIVE-Setup-arm64.exe
            release/MALACHI-OVERDRIVE-macOS-x64.dmg
            release/MALACHI-OVERDRIVE-macOS-x64.zip
            release/MALACHI-OVERDRIVE-macOS-arm64.dmg
            release/MALACHI-OVERDRIVE-macOS-arm64.zip
            release/MALACHI-OVERDRIVE-Linux-x64.AppImage
            release/MALACHI-OVERDRIVE-Linux-x64.deb
            release/MALACHI-OVERDRIVE-Linux-arm64.AppImage
            release/MALACHI-OVERDRIVE-Linux-arm64.deb
            release/MALACHI-OVERDRIVE-Extension.zip
            release/MALACHI-OVERDRIVE-Native-Sources.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
